[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "q-discovery-agent"
version = "0.1.0"
description = "Self-verifying quantum-classical agent for scientific experiment batch design"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
quantum = [
  "qiskit>=1.2",
  "qiskit-aer>=0.15",
]
ui = ["streamlit>=1.35"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
